# ===============================
# PROFILE DE PRODUCAO
# ===============================
# Ativar com: spring.profiles.active=prod
# Ou via variavel de ambiente: SPRING_PROFILES_ACTIVE=prod

# ===============================
# HIBERNATE - PRODUCAO
# ===============================

spring.jpa.hibernate.ddl-auto=none

# ===============================

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" th:href="@{/img/logo-colegio-satelite.png}">
    <title>Organiza+ - Novo Comunicado</title>
    <link rel="icon" type="image/png" th:href="@{/img/logo-colegio-satelite.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="form-page">

<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('novo-comunicado', false)}"></aside>

<main class="app-main form-main">
<div class="container">
    <div class="form-header">
        <span class="form-kicker">Gestao de Comunicados</span>
        <h1>Novo Comunicado</h1>
        <p class="texto-lateral">
            Preencha as informacoes para publicar este comunicado no painel administrativo e nas coordenadoras.
        </p>
    </div>

    <form th:action="@{/admin/comunicados/novo}" method="post" class="formulario">

        <th:block th:replace="~{fragments/csrf :: token}"></th:block>

        <div class="form-alerta campo-completo" role="alert" th:if="${mensagemErro != null}">
            <p th:text="${mensagemErro}">Erro</p>
        </div>

        <div class="campo campo-completo">
            <label for="titulo">Titulo</label>
            <input type="text" id="titulo" name="titulo" required placeholder="Titulo do comunicado">
        </div>

        <div class="campo campo-completo">
            <label for="conteudo">Conteudo</label>
            <textarea id="conteudo" name="conteudo" rows="5" placeholder="Descricao detalhada do comunicado"></textarea>
        </div>

        <div class="acoes campo-completo">
            <button type="submit" class="btn-editar">Publicar comunicado</button>
            <a th:href="@{/admin}" class="btn-voltar">Cancelar</a>
        </div>
    </form>
</div>
</main>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Semana em Foco - Dashboard da Coordenacao</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="form-page">

<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('admin', false)}"></aside>

    <main class="app-main form-main">
        <div class="container demanda-form-container">
            <div class="form-header">
                <span class="form-kicker">Colegio Satelite - Semana em Foco</span>
                <h1>Editar Semana em Foco</h1>
                <p class="texto-lateral">
                    Defina o segmento em destaque, titulo, descricao e periodo da Semana em Foco.
                </p>
            </div>

            <form th:action="@{/admin/semana-em-foco}"
                  method="post"
                  class="formulario demanda-form"
                  th:object="${semana}">

                <th:block th:replace="~{fragments/csrf :: token}"></th:block>

                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{ativa}" />

                <div class="form-alerta campo-completo" th:if="${#fields.hasAnyErrors()}">
                    <p>Corrija os campos destacados antes de salvar.</p>
                </div>

                <div class="campo">
                    <label for="segmento">Segmento em Destaque</label>
                    <select id="segmento"
                            th:field="*{segmento}"
                            required
                            th:classappend="${#fields.hasErrors('segmento')} ? ' campo-invalido'">
                        <option value="">Selecione</option>
                        <option th:each="segmentoItem : ${segmentos}"
                                th:value="${segmentoItem}"
                                th:text="${segmentoItem.titulo}">
                            Segmento
                        </option>
                    </select>
                    <small class="campo-erro" th:if="${#fields.hasErrors('segmento')}" th:errors="*{segmento}">Erro</small>
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade"
                            th:field="*{prioridade}"
                            required
                            th:classappend="${#fields.hasErrors('prioridade')} ? ' campo-invalido'">
                        <option value="">Selecione</option>
                        <option th:each="prioridadeItem : ${prioridades}"
                                th:value="${prioridadeItem}"
                                th:text="${prioridadeItem.titulo}">
                            Prioridade
                        </option>
                    </select>
                    <small class="campo-erro" th:if="${#fields.hasErrors('prioridade')}" th:errors="*{prioridade}">Erro</small>
                </div>

                <div class="campo campo-completo">
                    <label for="titulo">Titulo</label>
                    <input type="text"
                           id="titulo"
                           th:field="*{titulo}"
                           required
                           placeholder="Ex: Fundamental I em foco"
                           th:classappend="${#fields.hasErrors('titulo')} ? ' campo-invalido'">
                    <small class="campo-erro" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}">Erro</small>
                </div>

                <div class="campo campo-completo">
                    <label for="descricao">Descricao</label>
                    <textarea id="descricao"
                              th:field="*{descricao}"
                              rows="4"
                              required
                              placeholder="Detalhe o foco da semana, reunioes e objetivos pedagogicos..."
                              th:classappend="${#fields.hasErrors('descricao')} ? ' campo-invalido'"></textarea>
                    <small class="campo-erro" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}">Erro</small>
                </div>

                <div class="campo">
                    <label for="dataInicio">Data Inicio</label>
                    <input type="date"
                           id="dataInicio"
                           th:field="*{dataInicio}"
                           required
                           th:classappend="${#fields.hasErrors('dataInicio')} ? ' campo-invalido'">
                    <small class="campo-erro" th:if="${#fields.hasErrors('dataInicio')}" th:errors="*{dataInicio}">Erro</small>
                </div>

                <div class="campo">
                    <label for="dataFim">Data Fim</label>
                    <input type="date"
                           id="dataFim"
                           th:field="*{dataFim}"
                           required
                           th:classappend="${#fields.hasErrors('dataFim')} ? ' campo-invalido'">
                    <small class="campo-erro" th:if="${#fields.hasErrors('dataFim')}" th:errors="*{dataFim}">Erro</small>
                </div>

                <div class="acoes campo-completo">
                    <button type="submit" class="btn-editar">Salvar Semana em Foco</button>
                    <a th:href="@{/admin}" class="btn-deletar">Voltar</a>
                </div>
            </form>
        </div>
    </main>
</div>

</body>
</html>

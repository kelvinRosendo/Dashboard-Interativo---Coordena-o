<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" th:href="@{/img/logo-colegio-satelite.png}">
    <title>Organiza+ - Nova Demanda</title>
    <link rel="icon" type="image/png" th:href="@{/img/logo-colegio-satelite.png}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="form-page">

<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('admin', false)}"></aside>

    <main class="app-main form-main">
        <div class="container demanda-form-container">
            <div class="form-header">
                <span class="form-kicker">Demandas das Coordenacoes</span>
                <h1>Nova demanda</h1>
                <p class="texto-lateral">
                    Cadastre uma tarefa para uma coordenacao acompanhar e concluir.
                </p>
            </div>

            <form id="formComConflito"
                  th:action="@{/admin/demandas}"
                  method="post"
                  class="formulario demanda-form"
                  th:object="${demanda}">

                <th:block th:replace="~{fragments/csrf :: token}"></th:block>

                <div class="form-alerta campo-completo" role="alert" th:if="${#fields.hasAnyErrors()}">
                    <p>Corrija os campos destacados antes de salvar.</p>
                </div>

                <div class="campo campo-completo">
                    <label for="titulo">Titulo</label>
                    <input type="text"
                           id="titulo"
                           th:field="*{titulo}"
                           required
                           placeholder="Ex: Revisar plano semanal do Fundamental 1"
                           th:classappend="${#fields.hasErrors('titulo')} ? ' campo-invalido'">
                    <small class="campo-erro" role="alert" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}">Erro</small>
                </div>

                <div class="campo campo-completo">
                    <label for="descricao">Descricao</label>
                    <textarea id="descricao"
                              th:field="*{descricao}"
                              rows="4"
                              required
                              placeholder="Detalhe o que deve ser feito, contexto e expectativa de entrega."
                              th:classappend="${#fields.hasErrors('descricao')} ? ' campo-invalido'"></textarea>
                    <small class="campo-erro" role="alert" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}">Erro</small>
                </div>

                <div class="campo">
                    <label for="segmento">Coordenacao</label>
                    <select id="segmento"
                            th:field="*{segmento}"
                            required
                            th:classappend="${#fields.hasErrors('segmento')} ? ' campo-invalido'">
                        <option value="">Selecione</option>
                        <option th:each="segmentoItem : ${segmentosDemanda}"
                                th:value="${segmentoItem}"
                                th:text="${segmentoItem.titulo}">
                            Segmento
                        </option>
                    </select>
                    <small class="campo-erro" role="alert" th:if="${#fields.hasErrors('segmento')}" th:errors="*{segmento}">Erro</small>
                </div>

                <div class="campo">
                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade"
                            th:field="*{prioridade}"
                            required
                            th:classappend="${#fields.hasErrors('prioridade')} ? ' campo-invalido'">
                        <option value="">Selecione</option>
                        <option th:each="prioridadeItem : ${prioridadesDemanda}"
                                th:value="${prioridadeItem}"
                                th:text="${prioridadeItem.titulo}">
                            Prioridade
                        </option>
                    </select>
                    <small class="campo-erro" role="alert" th:if="${#fields.hasErrors('prioridade')}" th:errors="*{prioridade}">Erro</small>
                </div>

                <div class="campo">
                    <label for="dataPrazo">Prazo</label>
                    <input type="date"
                           id="dataPrazo"
                           th:field="*{dataPrazo}"
                           placeholder="dd/mm/aaaa"
                           th:classappend="${#fields.hasErrors('dataPrazo')} ? ' campo-invalido'">
                    <small class="campo-erro" role="alert" th:if="${#fields.hasErrors('dataPrazo')}" th:errors="*{dataPrazo}">Erro</small>
                </div>

                <div class="acoes campo-completo">
                    <button type="submit" class="btn-editar">Salvar demanda</button>
                    <a th:href="@{/admin}" class="btn-voltar">Voltar</a>
                </div>
            </form>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/conflito-modal :: conflitoModal}"></th:block>

</body>
</html>

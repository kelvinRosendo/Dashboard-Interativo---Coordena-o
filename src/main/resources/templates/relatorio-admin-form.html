<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${modoEdicao ? 'Editar Relatorio' : 'Novo Relatorio'}">Relatorio</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="form-page">

<div class="app-shell">
    <aside th:replace="~{fragments/sidebar :: sidebar('admin', false)}"></aside>

<main class="app-main form-main">
<div class="container">
    <div class="form-header">
        <span class="form-kicker">Colegio Satelite - Relatorios</span>
        <h1 th:text="${modoEdicao ? 'Editar Relatorio' : 'Novo Relatorio'}">Relatorio</h1>
        <p class="texto-lateral">
            Preencha as informacoes do relatorio da Semana em Foco.
        </p>
    </div>

    <form th:action="${modoEdicao} ? @{/relatorio/admin/relatorios/__${relatorio.id}__/editar} : @{/relatorio/admin/relatorios/novo}"
          method="post" class="formulario">

        <th:block th:replace="~{fragments/csrf :: token}"></th:block>

        <div class="form-alerta campo-completo" th:if="${mensagemErro != null}">
            <p th:text="${mensagemErro}">Erro</p>
        </div>

        <div class="campo campo-completo">
            <label for="semanaEmFocoId">Semana em Foco</label>
            <select id="semanaEmFocoId" name="semanaEmFocoId" required>
                <option value="">Selecione a semana</option>
                <option th:each="semana : ${semanas}"
                        th:value="${semana.id}"
                        th:text="${semana.titulo + ' (' + #temporals.format(semana.dataInicio, 'dd/MM/yyyy') + ' a ' + #temporals.format(semana.dataFim, 'dd/MM/yyyy') + ')'}"
                        th:selected="${semanaSelecionada != null and semanaSelecionada == semana.id}">
                </option>
            </select>
        </div>

        <div class="campo campo-completo">
            <label for="resumoSemana">Resumo da Semana</label>
            <textarea id="resumoSemana" name="resumoSemana" rows="5"
                      placeholder="Resumo geral da semana...">${relatorio?.resumoSemana}</textarea>
        </div>

        <div class="campo campo-completo">
            <label for="atividadesExecutadas">Atividades Executadas</label>
            <textarea id="atividadesExecutadas" name="atividadesExecutadas" rows="5"
                      placeholder="Atividades desenvolvidas durante a semana...">${relatorio?.atividadesExecutadas}</textarea>
        </div>

        <div class="campo campo-completo">
            <label for="pendencias">Pendencias</label>
            <textarea id="pendencias" name="pendencias" rows="5"
                      placeholder="Demandas nao concluidas...">${relatorio?.pendencias}</textarea>
        </div>

        <div class="campo campo-completo">
            <label for="observacoes">Observacoes</label>
            <textarea id="observacoes" name="observacoes" rows="5"
                      placeholder="Informacoes complementares...">${relatorio?.observacoes}</textarea>
        </div>

        <div class="campo campo-completo">
            <label for="conclusao">Conclusao</label>
            <textarea id="conclusao" name="conclusao" rows="5"
                      placeholder="Encerramento oficial da Semana em Foco...">${relatorio?.conclusao}</textarea>
        </div>

        <div class="acoes campo-completo">
            <button type="submit" class="btn-editar"
                    th:text="${modoEdicao} ? 'Atualizar' : 'Salvar'">
                Salvar
            </button>
            <a th:href="@{/relatorio/admin/relatorios}" class="btn-deletar">Cancelar</a>
        </div>
    </form>
</div>
</main>

</div>

</body>
</html>

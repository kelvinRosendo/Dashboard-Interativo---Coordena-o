# ===============================
# 🔹 CONFIGURAÇÃO DO BANCO DE DADOS (PostgreSQL)
# ===============================

# URL de conexão com o banco
# Formato: jdbc:postgresql://HOST:PORTA/NOME_DO_BANCO
spring.datasource.url=jdbc:postgresql://localhost:5432/dashboard_escolar

# Usuário do PostgreSQL
spring.datasource.username=postgres

# Senha do PostgreSQL (TROCAR PELA SUA)
spring.datasource.password=1234

# Driver do PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Porta da aplicacao
server.port=8081


# Carrega configuracoes locais do arquivo .env, quando ele existir.
spring.config.import=optional:file:./.env[.properties]

# ===============================
# GOOGLE LOGIN / OAUTH 2.0
# ===============================

# Crie essas credenciais no Google Cloud Console e salve como variaveis de ambiente ou no arquivo .env.
# Redirect URI local: http://localhost:8081/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=configure-google-client-id
spring.security.oauth2.client.registration.google.client-secret=configure-google-client-secret
spring.security.oauth2.client.registration.google.scope=openid,email,profile,https://www.googleapis.com/auth/calendar.readonly,https://www.googleapis.com/auth/calendar.events


# ===============================
# 🔹 CONFIGURAÇÃO DO JPA / HIBERNATE
# ===============================

# Dialeto do PostgreSQL (forma como o Hibernate conversa com o banco)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Estratégia de criação/atualização das tabelas
# update = cria e atualiza automaticamente as tabelas
spring.jpa.hibernate.ddl-auto=update


# ===============================
# 🔹 LOGS (AJUDA NO DESENVOLVIMENTO)
# ===============================

# Mostra as queries SQL no terminal
spring.jpa.show-sql=true

# Deixa o SQL mais organizado (bonito de ler)
spring.jpa.properties.hibernate.format_sql=true

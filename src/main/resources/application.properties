# ===============================
# CONFIGURACAO DO BANCO DE DADOS (PostgreSQL)
# ===============================

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/dashboard_escolar}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=8081

# Carrega configuracoes locais do arquivo .env, quando ele existir.
spring.config.import=optional:file:./.env[.properties]

# ===============================
# GOOGLE LOGIN / OAUTH 2.0
# ===============================

# Crie essas credenciais no Google Cloud Console e salve como variaveis de ambiente ou no arquivo .env.
# Redirect URI local: http://localhost:8081/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:configure-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:configure-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile,https://www.googleapis.com/auth/calendar.readonly,https://www.googleapis.com/auth/calendar.events

# ===============================
# CONFIGURACAO DO JPA / HIBERNATE
# ===============================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# ===============================
# LOGS (AJUDA NO DESENVOLVIMENTO)
# ===============================

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# CONTROLE DE ACESSO - ADMIN
# ===============================

# E-mails autorizados para acessar /admin, separados por vírgula
app.admin.authorized-emails=${ADMIN_EMAILS:alissandra@colegiosatelite.com.br}
